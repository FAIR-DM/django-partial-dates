[project]
name = "django-partial-dates"
version = "0.0.1"
description = "A Django model field for dates known to the year, the month or the day"
authors = [{ name = "Sam Jennings" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
keywords = ["django", "date", "partial date", "precision", "ISO 8601", "EDTF", "research"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = ["django>=5.2"]

[project.optional-dependencies]
django-filter = ["django-filter>=26.2"]
djangorestframework = ["djangorestframework>=3.18"]

[project.urls]
Homepage = "https://github.com/FAIR-DM/django-partial-dates"
Repository = "https://github.com/FAIR-DM/django-partial-dates"
Changelog = "https://github.com/FAIR-DM/django-partial-dates/blob/main/CHANGELOG.md"

[dependency-groups]
# Shared toolchain bundle from django-mvp/shared, pinned to a release tag. Ships
# ruff, mypy, deptry, pre-commit, pytest, pytest-django, coverage, django-stubs.
dev = [
    "mvp-shared[dev,test]",
    # The tests round-trip values through it. It is never a runtime dependency.
    "django-reversion>=6.5.0",
    # The extras' tests need both libraries in every test environment.
    "django-filter>=26.2",
    "djangorestframework>=3.18",
    # The pre-commit template runs pydoclint, which the bundle at v0.6.0 does not carry.
    "psycopg[binary]>=3.2",
    "pydoclint>=0.10.1",
]

[tool.uv.sources]
mvp-shared = { git = "https://github.com/django-mvp/shared.git", tag = "v0.6.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["partial_dates"]

[tool.hatch.build.targets.sdist]
include = ["/partial_dates", "/README.md", "/LICENSE"]

[tool.mypy]
files = ["partial_dates"]
ignore_missing_imports = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.ruff]
extend = "ruff-base.toml"

[tool.ruff.lint.extend-per-file-ignores]
# S101: asserts are the point of a test. S105: the test settings carry a
# placeholder SECRET_KEY. S608: the database tests write raw SQL on purpose, with
# quoted identifiers and bound values. S603: one test starts a fresh interpreter.
"tests/*" = ["S101", "S105", "S603", "S608"]
# S105, S106: the example project carries a placeholder SECRET_KEY and seeds sign-ins
# with a known password, for use on localhost.
"example/*" = ["S105", "S106"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]

[tool.coverage.run]
branch = true
source = ["partial_dates"]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.deptry]
extend_exclude = ["tests/", "docs/", "example/"]

[tool.forge.conformance]
# tests/test_init.py tests the package's top-level module, partial_dates/__init__.py, which the
# mirror rule cannot name. tests/test_guide.py tests a documentation page, not a module. The test
# app's models, migrations and fixtures are not modules under test.
non-mirror-paths = [
    "tests/test_init.py",
    "tests/test_guide.py",
    "tests/test_moving.py",
    "tests/models.py",
    "tests/test_models.py",
    "tests/migrations/",
    "tests/fixtures/",
    "tests/conftest.py",
    "tests/admin.py",
    "tests/test_admin.py",
    "tests/urls.py",
]
